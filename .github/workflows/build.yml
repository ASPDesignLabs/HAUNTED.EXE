# Builds HAUNTED.scr, HAUNTED.EXE and the zip on every push and pull request, runs the headless
# smoke test, and keeps the files as a workflow artifact.
#
# Releases: when main carries a VERSION that has no release yet, the build is published as release
# v<VERSION>, creating that tag on the commit. Pushing a tag v<VERSION> yourself does the same.
# A version with a, b or rc in it becomes a pre-release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install the MinGW-w64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zlib1g-dev

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($v)"
            exit 1
          fi

      - name: Build
        run: make scr zip

      - name: Smoke test
        run: make smoke

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum HAUNTED.EXE HAUNTED.scr HAUNTED-*-win64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "VERSION=$(cat ../VERSION)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v6
        with:
          name: HAUNTED-${{ env.VERSION }}
          path: |
            dist/HAUNTED.EXE
            dist/HAUNTED.scr
            dist/HAUNTED-*-win64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: smoke-frames
          path: build/smoke/*.png
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          pattern: HAUNTED-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          pre=""
          case "$tag" in *a[0-9]*|*b[0-9]*|*rc[0-9]*) pre="--prerelease" ;; esac
          ls -l dist
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              gh release upload "$tag" dist/* --clobber      # a re-run of the tag's build
            else
              echo "Release $tag already exists; bump VERSION to publish a new one."
            fi
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" $pre \
              --title "HAUNTED.EXE ${tag#v}" --notes-file .github/release-notes.md
          fi
